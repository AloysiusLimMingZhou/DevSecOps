name: CI Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
  
    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devsecops_test
        
        ports: 
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d devsecops_test"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=10
        
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: devsecops_test
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_SECRET: ${{ secrets.APP_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Run npm install by referring package-lock.json
        run: npm ci
      
      - name: Lint Test
        run: npm run lint
      
      - name: Unit Test
        run: npm run test:unit
      
      - name: Run database migration
        run: npm run migration:run
      
      - name: Integration Test
        run: npm run test:integration
      
      - name: E2E Test
        run: npm run test:e2e
      
      - name: NestJS Build
        run: npm run build