name: Trivy CI Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  image-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build image from DockerFile
        run: docker build -t docker.io/my-organization/my-app:${{ github.sha }} .
      
      - name: Scan Image Vulnerability & Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'docker.io/my-organization/my-app:${{ github.sha }}'
          format: 'github'
          output: 'image-artifact.sbom.json'
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'

      - name: Upload SBOM as Github Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 'trivy-image-sbom'
          path: '${{ github.workspace }}/image-artifact.sbom.json'
          retention-days: 30

      - name: Fail build on Critical/High Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'docker.io/my-organization/my-app:${{ github.sha }}'
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true

  repo-scan:
    name: Trivy Github Repo Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Run Trivy Vulnerability Scanner & Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: .
          format: 'github'
          github-pat: ${{  secrets.GITHUB_TOKEN  }}
          vuln-type: 'os,library'
          output: trivy-github-repo-report.sbom.json

      - name: Upload trivy report as Github Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 'trivy-repo-sbom'
          path: '${{  github.workspace  }}/trivy-github-repo-report.sbom.json'
          retention-days: 20
          
      - name: Fail Build on Critical/High Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true