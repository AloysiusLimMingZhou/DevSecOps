name: Trivy CI Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write

jobs:
  image-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image and Export
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: devsecops:api
      
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
      
      - name: Scan Image Vulnerability & Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'devsecops:api'
          format: 'cyclonedx'
          output: 'image-artifact.cdx.json'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'

      - name: Upload Image SBOM as Github Artifacts
        id: upload-sbom
        uses: actions/upload-artifact@v7
        with:
          name: 'trivy-image-sbom'
          path: '${{ github.workspace }}/trivy-image-artifact.cdx.json'
          retention-days: 30

      - name: Publish SBOM Download Link
        run: |
            echo '### Container SBOM' >> "$GITHUB_STEP_SUMMARY"
            echo '[Download Image SBOM](${{ steps.upload-sbom.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail build on Critical/High Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'devsecops:api'
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true

  repo-scan:
    name: Trivy Github Repo Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Run Trivy Vulnerability Scanner & Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: .
          format: 'cyclonedx'
          output: github-repo-report.cdx.json
          vuln-type: 'os,library'

      - name: Upload Repo SBOM as Github Artifacts
        id: repo_sbom
        uses: actions/upload-artifact@v7
        with:
          name: 'trivy-repo-sbom'
          path: '${{  github.workspace  }}/trivy-repo-report.cdx.json'
          retention-days: 30

      - name: Publish Repo SBOM Link
        env:
          ARTIFACT_URL: ${{ steps.repo_sbom.outputs.artifact-url }}
        run: |
          echo '### Repository SBOM' >> '$GITHUB_STEP_SUMMARY'
          echo '[Download Repository SBOM]($ARTIFACT_URL)' >> '$GITHUB_STEP_SUMMARY'
          
      - name: Fail Build on Critical/High Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true